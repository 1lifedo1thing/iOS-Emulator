<?xml version="1.0" encoding="UTF-8"?>
<!-- iPhone 3GS: front view, in tenths of a millimetre (62.1 x 115.5 mm body).
     Device art for iOS Emulator (src/skin.h). Element ids it reads, matched up to the first ".":
       body          the outline of the device (pressed side buttons sink into it)
       screen        exactly the panel; the running device's picture covers it
       home, power, volume-up, volume-down   the buttons that work (only those this device has)
       glare         a faint reflection drawn over the picture
     Everything else is decoration. Drawn with nanosvg: no filters, masks, clip paths, text or <use>. -->

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 741 1275" width="741" height="1275">
<defs>
<linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="681" y2="1215"><stop offset="0" stop-color="#5c5d61"/><stop offset="0.1" stop-color="#e8e9ed"/><stop offset="0.2" stop-color="#8a8b90"/><stop offset="0.34" stop-color="#f8f8fa"/><stop offset="0.47" stop-color="#9fa0a5"/><stop offset="0.6" stop-color="#eeeef2"/><stop offset="0.74" stop-color="#727378"/><stop offset="0.87" stop-color="#dcdde1"/><stop offset="1" stop-color="#606166"/></linearGradient>
<linearGradient id="btn-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c5d61"/><stop offset="0.1" stop-color="#e8e9ed"/><stop offset="0.2" stop-color="#8a8b90"/><stop offset="0.34" stop-color="#f8f8fa"/><stop offset="0.47" stop-color="#9fa0a5"/><stop offset="0.6" stop-color="#eeeef2"/><stop offset="0.74" stop-color="#727378"/><stop offset="0.87" stop-color="#dcdde1"/><stop offset="1" stop-color="#606166"/></linearGradient>
<linearGradient id="btn-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c5d61"/><stop offset="0.1" stop-color="#e8e9ed"/><stop offset="0.2" stop-color="#8a8b90"/><stop offset="0.34" stop-color="#f8f8fa"/><stop offset="0.47" stop-color="#9fa0a5"/><stop offset="0.6" stop-color="#eeeef2"/><stop offset="0.74" stop-color="#727378"/><stop offset="0.87" stop-color="#dcdde1"/><stop offset="1" stop-color="#606166"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#1d1e21"/><stop offset="0.5" stop-color="#101113"/><stop offset="1" stop-color="#08080a"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0d0e11"/><stop offset="1" stop-color="#040405"/></linearGradient>
<radialGradient id="home-dish" cx="0.5" cy="0.42" r="0.6"><stop offset="0" stop-color="#0b0b0c"/><stop offset="0.75" stop-color="#151517"/><stop offset="1" stop-color="#26262a"/></radialGradient>
<radialGradient id="lens" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#28324a"/><stop offset="0.5" stop-color="#0c0f18"/><stop offset="1" stop-color="#030304"/></radialGradient>
<linearGradient id="grille" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#2a2b2f"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0.9" y2="0.55"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.025"/><stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<g id="shadow">
<rect x="18" y="32" width="705" height="1239" rx="142" ry="142" fill="#000000" fill-opacity="0.045"/>
<rect x="24" y="38" width="693" height="1227" rx="136" ry="136" fill="#000000" fill-opacity="0.045"/>
<rect x="30" y="44" width="681" height="1215" rx="130" ry="130" fill="#000000" fill-opacity="0.045"/>
<rect x="36" y="50" width="669" height="1203" rx="124" ry="124" fill="#000000" fill-opacity="0.045"/>
<rect x="42" y="56" width="657" height="1191" rx="118" ry="118" fill="#000000" fill-opacity="0.045"/>
