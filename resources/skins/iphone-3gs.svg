<g id="volume-up"><rect x="46" y="292" width="44" height="72" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="300" width="3" height="56" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="volume-down"><rect x="46" y="390" width="44" height="72" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="398" width="3" height="56" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="switch0"><rect x="46" y="205" width="44" height="50" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="213" width="3" height="34" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<rect x="60" y="60" width="621" height="1155" rx="100" ry="100" id="body" fill="url(#rim)"/>
<rect x="62.5" y="62.5" width="616" height="1150" rx="97.5" ry="97.5" id="rim.edge" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
<rect x="73.5" y="73.5" width="594" height="1128" rx="86.5" ry="86.5" id="rim.seam" fill="#000000" fill-opacity="0.55"/>
<rect x="75" y="75" width="591" height="1125" rx="85" ry="85" id="face" fill="url(#glass)"/>
<rect x="77" y="77" width="587" height="1121" rx="83" ry="83" id="face.edge" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
<rect x="75" y="75" width="591" height="1125" rx="85" ry="85" id="face.sheen" fill="url(#sheen)"/>
<rect x="312.5" y="152.5" width="116" height="19" rx="9.5" ry="9.5" id="earpiece.rim" fill="#3a3b3f"/>
<rect x="314.5" y="154.5" width="112" height="15" rx="7.5" ry="7.5" id="earpiece" fill="url(#grille)"/>
<rect x="114" y="256" width="513" height="762" rx="2" ry="2" id="lcd" fill="#060607" stroke="#232428" stroke-opacity="0.7" stroke-width="1.5"/>
<rect id="screen" x="121" y="263" width="499" height="748" fill="url(#panel)"/>
<g id="home">
<circle cx="370.5" cy="1119" r="53" fill="url(#home-dish)" stroke="#3b3b40" stroke-width="2.5"/>
<circle cx="370.5" cy="1119" r="50" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="2"/>
<rect x="352.48" y="1100.98" width="36.04" height="36.04" rx="7.42" ry="7.42" fill="none" stroke="#8c8c92" stroke-width="3.392"/>
</g>
<path id="glare" d="M121,263 L580.08,263 L121,726.76 Z" fill="url(#shine)" fill-opacity="0.5"/>
</svg>
