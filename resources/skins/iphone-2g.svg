<rect x="54" y="68" width="622" height="1162" rx="98" ry="98" fill="#000000" fill-opacity="0.045"/>
</g>
<g id="power"><rect x="455" y="46" width="120" height="44" rx="8" ry="8" fill="url(#btn-v)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="463" y="48" width="104" height="3" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="volume-up"><rect x="46" y="288" width="44" height="88" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="296" width="3" height="72" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="volume-down"><rect x="46" y="380" width="44" height="88" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="388" width="3" height="72" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="switch0"><rect x="46" y="200" width="44" height="50" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="208" width="3" height="34" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<rect x="60" y="60" width="610" height="1150" rx="92" ry="92" id="body" fill="url(#rim)"/>
<rect x="62.5" y="62.5" width="605" height="1145" rx="89.5" ry="89.5" id="rim.edge" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
<rect x="82.5" y="82.5" width="565" height="1105" rx="69.5" ry="69.5" id="rim.seam" fill="#000000" fill-opacity="0.55"/>
<rect x="84" y="84" width="562" height="1102" rx="68" ry="68" id="face" fill="url(#glass)"/>
<rect x="86" y="86" width="558" height="1098" rx="66" ry="66" id="face.edge" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
<rect x="84" y="84" width="562" height="1102" rx="68" ry="68" id="face.sheen" fill="url(#sheen)"/>
<rect x="304" y="151.5" width="122" height="19" rx="9.5" ry="9.5" id="earpiece.rim" fill="#3a3b3f"/>
<rect x="306" y="153.5" width="118" height="15" rx="7.5" ry="7.5" id="earpiece" fill="url(#grille)"/>
<rect x="108.5" y="254" width="513" height="762" rx="2" ry="2" id="lcd" fill="#060607" stroke="#232428" stroke-opacity="0.7" stroke-width="1.5"/>
<rect id="screen" x="115.5" y="261" width="499" height="748" fill="url(#panel)"/>
<g id="home">
<circle cx="365" cy="1116" r="53" fill="url(#home-dish)" stroke="#3b3b40" stroke-width="2.5"/>
<circle cx="365" cy="1116" r="50" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="2"/>
<rect x="346.98" y="1097.98" width="36.04" height="36.04" rx="7.42" ry="7.42" fill="none" stroke="#8c8c92" stroke-width="3.392"/>
</g>
<path id="glare" d="M115.5,261 L574.58,261 L115.5,724.76 Z" fill="url(#shine)" fill-opacity="0.5"/>
</svg>
