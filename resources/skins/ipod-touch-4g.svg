<?xml version="1.0" encoding="UTF-8"?>
<!-- iPod touch (4th generation): front view, in tenths of a millimetre (58.9 x 111.0 mm body).
     Device art for iOS Emulator (src/skin.h). Element ids it reads, matched up to the first ".":
       body          the outline of the device (pressed side buttons sink into it)
       screen        exactly the panel; the running device's picture covers it
       home, power, volume-up, volume-down   the buttons that work (only those this device has)
       glare         a faint reflection drawn over the picture
     Everything else is decoration. Drawn with nanosvg: no filters, masks, clip paths, text or <use>. -->

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 709 1230" width="709" height="1230">
<defs>
<linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="649" y2="1170"><stop offset="0" stop-color="#7d7e82"/><stop offset="0.15" stop-color="#d4d5d9"/><stop offset="0.3" stop-color="#a9aaae"/><stop offset="0.48" stop-color="#e6e7ea"/><stop offset="0.62" stop-color="#9c9da1"/><stop offset="0.8" stop-color="#d0d1d5"/><stop offset="1" stop-color="#86878b"/></linearGradient>
<linearGradient id="btn-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d7e82"/><stop offset="0.15" stop-color="#d4d5d9"/><stop offset="0.3" stop-color="#a9aaae"/><stop offset="0.48" stop-color="#e6e7ea"/><stop offset="0.62" stop-color="#9c9da1"/><stop offset="0.8" stop-color="#d0d1d5"/><stop offset="1" stop-color="#86878b"/></linearGradient>
<linearGradient id="btn-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d7e82"/><stop offset="0.15" stop-color="#d4d5d9"/><stop offset="0.3" stop-color="#a9aaae"/><stop offset="0.48" stop-color="#e6e7ea"/><stop offset="0.62" stop-color="#9c9da1"/><stop offset="0.8" stop-color="#d0d1d5"/><stop offset="1" stop-color="#86878b"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#1d1e21"/><stop offset="0.5" stop-color="#101113"/><stop offset="1" stop-color="#08080a"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0d0e11"/><stop offset="1" stop-color="#040405"/></linearGradient>
<radialGradient id="home-dish" cx="0.5" cy="0.42" r="0.6"><stop offset="0" stop-color="#0b0b0c"/><stop offset="0.75" stop-color="#151517"/><stop offset="1" stop-color="#26262a"/></radialGradient>
<radialGradient id="lens" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#28324a"/><stop offset="0.5" stop-color="#0c0f18"/><stop offset="1" stop-color="#030304"/></radialGradient>
<linearGradient id="grille" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#2a2b2f"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0.9" y2="0.55"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.025"/><stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<g id="shadow">
<rect x="18" y="32" width="673" height="1194" rx="120" ry="120" fill="#000000" fill-opacity="0.045"/>
<rect x="24" y="38" width="661" height="1182" rx="114" ry="114" fill="#000000" fill-opacity="0.045"/>
<rect x="30" y="44" width="649" height="1170" rx="108" ry="108" fill="#000000" fill-opacity="0.045"/>
<rect x="36" y="50" width="637" height="1158" rx="102" ry="102" fill="#000000" fill-opacity="0.045"/>
<rect x="42" y="56" width="625" height="1146" rx="96" ry="96" fill="#000000" fill-opacity="0.045"/>
<rect x="48" y="62" width="613" height="1134" rx="90" ry="90" fill="#000000" fill-opacity="0.045"/>
<rect x="54" y="68" width="601" height="1122" rx="84" ry="84" fill="#000000" fill-opacity="0.045"/>
</g>
<g id="power"><rect x="460" y="49" width="110" height="41" rx="8" ry="8" fill="url(#btn-v)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="468" y="51" width="94" height="3" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="volume-up"><rect x="49" y="220" width="41" height="80" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="51" y="228" width="3" height="64" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="volume-down"><rect x="49" y="306" width="41" height="80" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="51" y="314" width="3" height="64" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<rect x="60" y="60" width="589" height="1110" rx="78" ry="78" id="body" fill="url(#rim)"/>
<rect x="62.5" y="62.5" width="584" height="1105" rx="75.5" ry="75.5" id="rim.edge" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
<rect x="69.5" y="69.5" width="570" height="1091" rx="68.5" ry="68.5" id="rim.seam" fill="#000000" fill-opacity="0.55"/>
<rect x="71" y="71" width="567" height="1088" rx="67" ry="67" id="face" fill="url(#glass)"/>
<rect x="73" y="73" width="563" height="1084" rx="65" ry="65" id="face.edge" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
<rect x="71" y="71" width="567" height="1088" rx="67" ry="67" id="face.sheen" fill="url(#sheen)"/>
<circle id="camera.ring" cx="354.5" cy="152" r="16" fill="#1c1d20"/>
<circle id="camera" cx="354.5" cy="152" r="13" fill="url(#lens)"/>
<circle id="camera.glint" cx="350.6" cy="148.1" r="3.25" fill="#ffffff" fill-opacity="0.3"/>
<rect x="98" y="234" width="513" height="762" rx="2" ry="2" id="lcd" fill="#060607" stroke="#232428" stroke-opacity="0.7" stroke-width="1.5"/>
<rect id="screen" x="105" y="241" width="499" height="748" fill="url(#panel)"/>
<g id="home">
<circle cx="354.5" cy="1083" r="48" fill="url(#home-dish)" stroke="#3b3b40" stroke-width="2.5"/>
<circle cx="354.5" cy="1083" r="45" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="2"/>
<rect x="338.18" y="1066.68" width="32.64" height="32.64" rx="6.72" ry="6.72" fill="none" stroke="#8c8c92" stroke-width="3.072"/>
</g>
<path id="glare" d="M105,241 L564.08,241 L105,704.76 Z" fill="url(#shine)" fill-opacity="0.5"/>
</svg>
