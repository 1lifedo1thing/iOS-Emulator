<rect x="54" y="68" width="598" height="1164" rx="88" ry="88" fill="#000000" fill-opacity="0.045"/>
</g>
<g id="power"><rect x="435" y="48" width="105" height="42" rx="6" ry="6" fill="url(#btn-v)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="441" y="50" width="93" height="3" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
