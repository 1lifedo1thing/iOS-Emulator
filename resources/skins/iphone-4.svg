<g id="volume-down"><rect x="48" y="378" width="42" height="62" rx="21" ry="21" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="50" y="399" width="3" height="20" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="switch0"><rect x="48" y="200" width="42" height="40" rx="6" ry="6" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="50" y="206" width="3" height="28" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<rect x="60" y="60" width="586" height="1152" rx="82" ry="82" id="body" fill="url(#rim)"/>
<rect x="62.5" y="62.5" width="581" height="1147" rx="79.5" ry="79.5" id="rim.edge" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
<rect x="75.5" y="75.5" width="555" height="1121" rx="66.5" ry="66.5" id="rim.seam" fill="#000000" fill-opacity="0.55"/>
<rect x="77" y="77" width="552" height="1118" rx="65" ry="65" id="face" fill="url(#glass)"/>
<rect x="79" y="79" width="548" height="1114" rx="63" ry="63" id="face.edge" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
<rect x="77" y="77" width="552" height="1118" rx="65" ry="65" id="face.sheen" fill="url(#sheen)"/>
<rect id="gap" x="220" y="60" width="7" height="17" fill="#18181a"/>
<rect id="gap" x="60" y="1095" width="17" height="7" fill="#18181a"/>
<rect id="gap" x="629" y="1095" width="17" height="7" fill="#18181a"/>
<rect x="301" y="151.5" width="104" height="17" rx="8.5" ry="8.5" id="earpiece.rim" fill="#3a3b3f"/>
<rect x="303" y="153.5" width="100" height="13" rx="6.5" ry="6.5" id="earpiece" fill="url(#grille)"/>
<circle id="camera.ring" cx="238" cy="158" r="15" fill="#1c1d20"/>
<circle id="camera" cx="238" cy="158" r="12" fill="url(#lens)"/>
<circle id="camera.glint" cx="234.4" cy="154.4" r="3" fill="#ffffff" fill-opacity="0.3"/>
<rect x="96.5" y="255" width="513" height="762" rx="2" ry="2" id="lcd" fill="#060607" stroke="#232428" stroke-opacity="0.7" stroke-width="1.5"/>
<rect id="screen" x="103.5" y="262" width="499" height="748" fill="url(#panel)"/>
<g id="home">
<circle cx="353" cy="1113" r="50" fill="url(#home-dish)" stroke="#3b3b40" stroke-width="2.5"/>
<circle cx="353" cy="1113" r="47" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="2"/>
<rect x="336" y="1096" width="34" height="34" rx="7" ry="7" fill="none" stroke="#8c8c92" stroke-width="3.2"/>
</g>
<path id="glare" d="M103.5,262 L562.58,262 L103.5,725.76 Z" fill="url(#shine)" fill-opacity="0.5"/>
</svg>
