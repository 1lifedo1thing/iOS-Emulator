<?xml version="1.0" encoding="UTF-8"?>
<!-- iPod touch (2nd and 3rd generation): front view, in tenths of a millimetre (61.8 x 110.0 mm body).
     Device art for iOS Emulator (src/skin.h). Element ids it reads, matched up to the first ".":
       body          the outline of the device (pressed side buttons sink into it)
       screen        exactly the panel; the running device's picture covers it
       home, power, volume-up, volume-down   the buttons that work (only those this device has)
       glare         a faint reflection drawn over the picture
     Everything else is decoration. Drawn with nanosvg: no filters, masks, clip paths, text or <use>. -->

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 738 1220" width="738" height="1220">
<defs>
<linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="678" y2="1160"><stop offset="0" stop-color="#5c5d61"/><stop offset="0.1" stop-color="#e8e9ed"/><stop offset="0.2" stop-color="#8a8b90"/><stop offset="0.34" stop-color="#f8f8fa"/><stop offset="0.47" stop-color="#9fa0a5"/><stop offset="0.6" stop-color="#eeeef2"/><stop offset="0.74" stop-color="#727378"/><stop offset="0.87" stop-color="#dcdde1"/><stop offset="1" stop-color="#606166"/></linearGradient>
<linearGradient id="btn-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c1c1e"/><stop offset="0.45" stop-color="#3a3a3d"/><stop offset="0.55" stop-color="#2e2e31"/><stop offset="1" stop-color="#151517"/></linearGradient>
<linearGradient id="btn-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="0.45" stop-color="#3a3a3d"/><stop offset="0.55" stop-color="#2e2e31"/><stop offset="1" stop-color="#151517"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#1d1e21"/><stop offset="0.5" stop-color="#101113"/><stop offset="1" stop-color="#08080a"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0d0e11"/><stop offset="1" stop-color="#040405"/></linearGradient>
<radialGradient id="home-dish" cx="0.5" cy="0.42" r="0.6"><stop offset="0" stop-color="#0b0b0c"/><stop offset="0.75" stop-color="#151517"/><stop offset="1" stop-color="#26262a"/></radialGradient>
<radialGradient id="lens" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#28324a"/><stop offset="0.5" stop-color="#0c0f18"/><stop offset="1" stop-color="#030304"/></radialGradient>
<linearGradient id="grille" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#2a2b2f"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0.9" y2="0.55"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.025"/><stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<g id="shadow">
<rect x="18" y="32" width="702" height="1184" rx="130" ry="130" fill="#000000" fill-opacity="0.045"/>
<rect x="24" y="38" width="690" height="1172" rx="124" ry="124" fill="#000000" fill-opacity="0.045"/>
<rect x="30" y="44" width="678" height="1160" rx="118" ry="118" fill="#000000" fill-opacity="0.045"/>
<rect x="36" y="50" width="666" height="1148" rx="112" ry="112" fill="#000000" fill-opacity="0.045"/>
<rect x="42" y="56" width="654" height="1136" rx="106" ry="106" fill="#000000" fill-opacity="0.045"/>
<rect x="48" y="62" width="642" height="1124" rx="100" ry="100" fill="#000000" fill-opacity="0.045"/>
<rect x="54" y="68" width="630" height="1112" rx="94" ry="94" fill="#000000" fill-opacity="0.045"/>
</g>
<g id="power"><rect x="140" y="46" width="120" height="44" rx="8" ry="8" fill="url(#btn-v)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="148" y="48" width="104" height="3" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="volume-up"><rect x="46" y="210" width="44" height="88" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="218" width="3" height="72" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<g id="volume-down"><rect x="46" y="302" width="44" height="88" rx="8" ry="8" fill="url(#btn-h)" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/><rect x="48" y="310" width="3" height="72" rx="1.5" ry="1.5" fill="#ffffff" fill-opacity="0.35"/></g>
<rect x="60" y="60" width="618" height="1100" rx="88" ry="88" id="body" fill="url(#rim)"/>
<rect x="62.5" y="62.5" width="613" height="1095" rx="85.5" ry="85.5" id="rim.edge" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
<rect x="71.5" y="71.5" width="595" height="1077" rx="76.5" ry="76.5" id="rim.seam" fill="#000000" fill-opacity="0.55"/>
<rect x="73" y="73" width="592" height="1074" rx="75" ry="75" id="face" fill="url(#glass)"/>
<rect x="75" y="75" width="588" height="1070" rx="73" ry="73" id="face.edge" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
<rect x="73" y="73" width="592" height="1074" rx="75" ry="75" id="face.sheen" fill="url(#sheen)"/>
<rect x="112.5" y="229" width="513" height="762" rx="2" ry="2" id="lcd" fill="#060607" stroke="#232428" stroke-opacity="0.7" stroke-width="1.5"/>
<rect id="screen" x="119.5" y="236" width="499" height="748" fill="url(#panel)"/>
<g id="home">
<circle cx="369" cy="1074" r="52.5" fill="url(#home-dish)" stroke="#3b3b40" stroke-width="2.5"/>
<circle cx="369" cy="1074" r="49.5" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="2"/>
<rect x="351.15" y="1056.15" width="35.7" height="35.7" rx="7.35" ry="7.35" fill="none" stroke="#8c8c92" stroke-width="3.36"/>
</g>
<path id="glare" d="M119.5,236 L578.58,236 L119.5,699.76 Z" fill="url(#shine)" fill-opacity="0.5"/>
</svg>
