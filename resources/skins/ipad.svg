<rect x="152" y="152" width="1813" height="2344" rx="108" ry="108" id="face.sheen" fill="url(#sheen)"/>
<rect x="307.5" y="326.5" width="1502" height="1995" rx="2" ry="2" id="lcd" fill="#060607" stroke="#232428" stroke-opacity="0.7" stroke-width="1.5"/>
<rect id="screen" x="319.5" y="338.5" width="1478" height="1971" fill="url(#panel)"/>
<g id="home">
<circle cx="1058.5" cy="2424" r="56" fill="url(#home-dish)" stroke="#3b3b40" stroke-width="2.5"/>
<circle cx="1058.5" cy="2424" r="53" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="2"/>
